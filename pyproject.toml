[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiopan"
version = "8.0.0"
description = "CellPath — PUMA Grand Challenge Track 2 Panoptic Segmentation (v8)"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.16",
    "timm>=1.0.3",
    "transformers>=4.36.0",
    "huggingface_hub>=0.23",
    "numpy>=2.0,<2.1",
    "scipy>=1.11",
    "albumentations>=2.0",
    "opencv-python-headless>=4.8",
    "tifffile>=2024",
    "tqdm>=4.64",
    "Pillow>=10.4,<12",
    "bitsandbytes>=0.43",
    "safetensors>=0.4",
    "PyYAML>=6.0",
    "packaging>=21",
    "lark>=1.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
