[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiopan"
version = "8.0.0"
description = "CellPath — PUMA Grand Challenge Track 2 Panoptic Segmentation (v8)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "timm>=1.0.3",
    "transformers>=4.36.0",
    "huggingface_hub",
    "albumentations",
    "opencv-python-headless",
    "scipy",
    "numpy>=2.0,<2.1",
    "tifffile",
    "tqdm",
    "Pillow",
    "bitsandbytes",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
