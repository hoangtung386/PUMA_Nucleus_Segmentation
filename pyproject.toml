[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiopan"
version = "9.0.0"
description = "CellPath — PUMA Grand Challenge Track 2 Panoptic Segmentation (v9)"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.16",
    "timm>=1.0.3",
    "transformers>=4.36.0",
    "huggingface_hub>=0.23",
    "numpy>=2.0,<2.1",
    "scipy>=1.11",
    "albumentations>=2.0",
    "opencv-python-headless>=4.8",
    "tifffile>=2024",
    "tqdm>=4.64",
    "Pillow>=10.4,<12",
    "bitsandbytes>=0.43",
    "safetensors>=0.4",
    "PyYAML>=6.0",
    "packaging>=21",
    "lark>=1.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyter",
    "ipykernel",
]

[project.scripts]
symbiopan-preprocess = "scripts.preprocess:main"
symbiopan-train = "scripts.train_stage1:main"
symbiopan-infer = "scripts.infer_wsi:main"

[tool.setuptools.packages.find]
include = ["symbiopan*", "configs*"]
exclude = ["tests*", "notebooks*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "N806"]
"symbiopan/**/*.py" = ["N812"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["symbiopan"]
omit = [
    "*/tests/*",
    "*/notebooks/*",
    "symbiopan/data/preprocessing/preprocess.py",
    "symbiopan/inference/infer_wsi.py",
    "symbiopan/training/stage1_trainer.py",
    "symbiopan/training/cli.py",
]

[tool.coverage.report]
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
