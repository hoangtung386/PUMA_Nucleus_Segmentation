[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiopan"
version = "8.0.0"
description = "CellPath — PUMA Grand Challenge Track 2 Panoptic Segmentation (v8)"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.27",
    "transformers==5.9.0",
    "huggingface_hub==1.16.1",
    "numpy==2.0.2",
    "scipy==1.17.1",
    "albumentations==2.0.8",
    "opencv-python-headless==4.13.0.92",
    "tifffile==2026.3.3",
    "tqdm==4.67.3",
    "Pillow==11.2.0",
    "bitsandbytes==0.49.2",
    "safetensors==0.7.0",
    "PyYAML==6.0.3",
    "packaging==26.0",
    "lark==1.3.1",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
